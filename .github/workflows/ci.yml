# Lint and test on every push to main and every pull request.
# The tests use synthetic data, so no proprietary inputs are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests notebooks

      - name: Check formatting
        run: uv run ruff format --check src tests notebooks

      - name: Run tests
        run: uv run pytest
