[project]
name = "hf-factor-zoo"
version = "0.1.0"
description = "Intraday market-return forecasting with regularized factor models and block-bootstrap evaluation"
readme = "README.md"
authors = [
    { name = "ChuaoD"}
]
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "threadpoolctl>=3.6.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "data",
    "replication_files",
    "results",
    ".local_archive",
]

[tool.ruff.lint]
select = [
    "E",   # style errors
    "F",   # logical and import errors
    "I",   # import ordering
    "B",   # likely bugs
    "UP",  # modern Python syntax
]

[tool.ruff.format]
quote-style = "double"
